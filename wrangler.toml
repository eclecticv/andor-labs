# Pages project configuration.
#
# Generated by `wrangler pages download config andorlabs` rather than written by
# hand, and that ordering matters: Pages does not support partial configuration.
# The moment this file exists it becomes the source of truth and the equivalent
# dashboard fields go read-only, so a hand-written file would have silently
# orphaned whatever was already configured there. Downloading first preserves it.
#
# Secrets are a separate surface and are NOT represented here. GEMINI_API_KEY and
# LOOPS_API_KEY remain encrypted on the project and survive this file untouched;
# manage them with `wrangler pages secret put <NAME> --project-name andorlabs`.
# Never move a secret into `vars` — that would store it in plaintext, in git.
name = "andorlabs"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-08"

# Pages treats vars and bindings as non-inheritable, so each environment repeats
# them in full. There is no top-level fallback the way there is for Workers.

# ── production ──────────────────────────────────────────────────────────────
[env.production.vars]
NODE_VERSION = "22"

[[env.production.d1_databases]]
binding = "RANKINGS"
database_name = "andor-rankings"
database_id = "662a14cc-7ed7-47d0-9dbb-a0e10d95ff43"
migrations_dir = "migrations"

# ── preview ─────────────────────────────────────────────────────────────────
# Preview points at the same database on purpose. The leaderboard routes are
# server-rendered and query D1 on every request, so a preview branch without a
# binding would 500 rather than degrade. Sharing the database is safe because
# preview holds no model-provider secrets (`wrangler pages secret list --env
# preview` is empty), so the ranking pipeline cannot run there and cannot write.
# If preview ever gets its own keys, it needs its own database at the same time.
[env.preview.vars]
NODE_VERSION = "22"

[[env.preview.d1_databases]]
binding = "RANKINGS"
database_name = "andor-rankings"
database_id = "662a14cc-7ed7-47d0-9dbb-a0e10d95ff43"
migrations_dir = "migrations"
